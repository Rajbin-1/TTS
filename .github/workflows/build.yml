name: Build Windows Desktop Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask pyinstaller

    - name: Download and Extract Piper Windows Binaries
      run: |
        curl -L -o piper.zip "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip"
        Expand-Archive -Path piper.zip -DestinationPath . -Force
        Remove-Item piper.zip

    - name: Package Desktop App with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed `
          --add-data "templates;templates" `
          --add-data "static;static" `
          --add-data "piper;piper" `
          --hidden-import=flask `
          --collect-all=flask `
          --name "Piper_TTS_Studio" `
          app.py

    - name: Compress Build Output into ZIP Package
      run: |
        Compress-Archive -Path "dist/Piper_TTS_Studio/*" -DestinationPath "dist/Piper_TTS_Studio_Windows.zip" -Force

    - name: Upload Standalone Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Piper_TTS_Studio_Windows_x64
        path: dist/Piper_TTS_Studio_Windows.zip
