name: Build Windows Executable

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask pyinstaller

    - name: Download and Extract Piper Binaries
      run: |
        curl -L -o piper.zip "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip"
        Expand-Archive -Path piper.zip -DestinationPath . -Force
        Remove-Item piper.zip

    - name: Package with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --add-data "templates;templates" --add-data "piper;piper" --name "TTS_App" app.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TTS_App_Windows
        path: dist/TTS_App
        
